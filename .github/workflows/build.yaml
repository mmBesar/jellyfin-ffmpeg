name: '🏗️ Build jellyfin-ffmpeg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - jellyfin
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - jellyfin
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["trixie"]'
      architectures: '["arm64"]'
      release: false

  build_ubuntu:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'ubuntu'
      codenames: '["jammy", "noble", "resolute"]'
      architectures: '["amd64", "arm64"]'
      release: false

  build_portable_windows_clang:
    uses: ./.github/workflows/_meta_win_clang_portable.yaml
    with:
      release: false

  build_portable_linux:
    uses: ./.github/workflows/_meta_portable.yaml
    with:
      os: 'linux'
      architectures: '["amd64", "arm64"]'
      release: false

  build_portable_mac:
    uses: ./.github/workflows/_meta_mac_portable.yaml
    with:
      release: false
